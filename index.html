<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raciel Chirino Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cursos online de edición de video, redes sociales y community management con Raciel Chirino.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RCH Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Bodoni+Moda:opsz,wght@6..96,600;6..96,800&display=swap">
<style>
/* Layout: app móvil de una columna sobre blanco; saludo, carrusel de banners, fila horizontal "Continuar viendo",
   lista de cursos con portada, barra inferior con píldora rosada. Las portadas son imágenes que sube la administradora. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --ink:#141A26; --muted:#8B93A3; --soft:#F5F6F8; --line:#ECEEF2;
  --coral:#CF6658; --coral-soft:#FBE8E5; --pink:#E27BB5;
  --ok:#1E8455; --ok-bg:#E4F4EC; --warn:#946200; --warn-bg:#FDF2D7; --bad:#B8381E; --bad-bg:#FCE6E0;
  --band-rosa:#E27BB5; --band-coral:#CF6658; --band-naranja:#DE8E3A; --band-azul:#2E3B5B; --band-negro:#141A26;
  --f-body:"Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-serif:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --r:20px;
  --shadow:0 6px 22px rgba(20,26,38,.09);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:8px}
img{max-width:100%;display:block}
.wrap{max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
main{padding-block:14px 24px;display:flex;flex-direction:column;gap:26px}

/* Saludo */
.hello{padding-top:14px}
.hello p{color:var(--muted);font-size:1.12rem}
.hello h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}

/* Encabezado de subpáginas */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:56px}
.top h2{font-size:1.1rem;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;margin-left:-10px;flex:none}
.iconbtn:hover{background:var(--soft)}

/* Carrusel de banners */
.carousel{display:flex;flex-direction:column;gap:12px;align-items:center}
.slides{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%;border-radius:var(--r)}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--soft);max-width:100%}
.slide img{width:100%;height:100%;object-fit:cover}
.slide-default{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.slide-default .big{font:800 clamp(1.9rem,9vw,3.2rem)/1 var(--f-serif);letter-spacing:.02em;color:var(--ink);text-align:center}
.slide-default .rule{display:flex;align-items:center;gap:12px;width:80%;font:500 .72rem/1 var(--f-body);letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.slide-default .rule::before,.slide-default .rule::after{content:"";flex:1;height:1px;background:var(--ink)}
.slide-default .sub{font:600 clamp(1.1rem,5vw,1.7rem)/1 var(--f-serif);letter-spacing:.3em;color:var(--coral);text-transform:uppercase}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:width .2s,background .2s}
.dots i.on{width:22px;background:var(--coral)}

/* Secciones */
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-head h2{font-size:1.4rem;font-weight:500}
.sec-head a{color:var(--coral);font-weight:500;font-size:1.05rem}

/* Continuar viendo */
.hrow{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-20px;padding:4px 20px 14px}
.hrow::-webkit-scrollbar{display:none}
.cw{flex:0 0 min(78%,300px);scroll-snap-align:start;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--bg);display:flex;flex-direction:column}
.cw .img{aspect-ratio:2/1;max-width:100%}
.band{--b:var(--band-rosa);background:var(--b);color:#fff;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.band b{font-weight:500;text-transform:uppercase;letter-spacing:.02em;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .pr{display:flex;align-items:center;gap:12px;font-size:.85rem;font-weight:500;font-variant-numeric:tabular-nums}
.band .bar{flex:1;height:4px;border-radius:9px;background:color-mix(in srgb,currentColor 30%,transparent);overflow:hidden}
.band .bar span{display:block;height:100%;background:currentColor;border-radius:9px}

/* Portadas */
.img{position:relative;background:var(--soft);overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ph{--b:var(--band-rosa);position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:18px 22px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--b) 14%,#fff),color-mix(in srgb,var(--b) 30%,#fff))}
.ph .k{font:800 clamp(1.7rem,7.5vw,2.6rem)/1 var(--f-serif);color:var(--ink);letter-spacing:-.01em}
.ph .s{font:700 clamp(1rem,4.2vw,1.4rem)/1.1 var(--f-body);color:var(--b)}

/* Todos los cursos */
.courses{display:flex;flex-direction:column;gap:22px}
.cc{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--bg);display:flex;flex-direction:column}
.cc .img{aspect-ratio:16/9;max-width:100%}
.cc .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.cc h3{font-size:1.1rem;font-weight:700}
.cc .meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:.9rem}
.cc .price{margin-left:auto;font-weight:700;font-size:1.15rem;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500;padding:4px 10px;border-radius:99px;width:max-content}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:500;cursor:pointer;font-size:1rem}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.primary:hover{filter:brightness(1.05);background:var(--coral)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:var(--ink);filter:brightness(1.2)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:38px;padding:0 16px;font-size:.9rem}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Detalle del curso */
.hero{margin-inline:-20px;aspect-ratio:16/9;max-width:none}
@media (min-width:680px){.hero{margin-inline:0;border-radius:var(--r)}}
.detail-head{display:flex;flex-direction:column;gap:8px}
.detail-head h1{font-size:1.6rem;font-weight:700}
.detail-head .meta{color:var(--muted);font-size:.92rem}
.lead{color:#4E5666;font-size:1rem}
.box{background:var(--soft);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.note{padding:14px 16px;border-radius:14px;font-size:.95rem}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.plain{background:var(--soft);color:var(--muted)}
.small{font-size:.86rem}
.muted{color:var(--muted)}
.center{text-align:center}

.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lesson{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;padding:10px 4px;border-radius:14px;min-height:62px}
a.lesson:hover{background:var(--soft)}
.lesson .n{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:500;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson.done .n{background:var(--ok-bg);color:var(--ok)}
.lesson.current .n{background:var(--coral);color:#fff}
.lesson .t{min-width:0;font-weight:500}
.lesson .t span{display:block;font-size:.82rem;color:var(--muted);font-weight:400}
.lesson .ic{color:var(--muted)}

/* Reproductor */
.player{background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center}
.player video,.player iframe{width:100%;height:100%;display:block;background:#000;border:0}
.player .empty{color:#D5D9E0;text-align:center;padding:24px;display:flex;flex-direction:column;gap:10px;align-items:center}
.player .empty a{color:#F3A6CF;font-weight:500}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--pink);border-radius:99px}

/* Mis cursos */
.mine{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;padding:10px;border-radius:var(--r);box-shadow:var(--shadow)}
.mine .img{aspect-ratio:1;border-radius:14px;max-width:100%}
.mine .t{min-width:0;display:flex;flex-direction:column;gap:8px}
.mine .t b{font-weight:500}

/* Perfil */
.avatar{width:72px;height:72px;border-radius:50%;background:var(--coral-soft);color:var(--coral);display:grid;place-items:center;font-size:1.7rem;font-weight:700;flex:none}
.menu{display:flex;flex-direction:column;border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.menu a,.menu button{display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg);border:0;text-align:left;cursor:pointer;font-weight:500;width:100%}
.menu > * + *{border-top:1px solid var(--line)}
.menu a:hover,.menu button:hover{background:var(--soft)}
.menu .chev{margin-left:auto;color:var(--muted)}

/* Formularios */
label.f{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:500}
label.f small{font-weight:400;color:var(--muted)}
.in{width:100%;min-height:50px;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:12px 16px;font-size:1rem}
textarea.in{min-height:140px;resize:vertical;line-height:1.5}
.in:focus{border-color:var(--coral);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.bank{white-space:pre-wrap;font:500 .95rem/1.6 var(--f-body);background:var(--soft);border-radius:14px;padding:14px 16px;margin:0;overflow-x:auto}
.drop{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.drop:hover{border-color:var(--coral)}
.drop img{max-height:220px;border-radius:10px}
.gsi{display:flex;justify-content:center;min-height:44px}
.gsi .gbtn{width:100%}
.gbtn{gap:12px;border-color:var(--line);box-shadow:0 1px 3px rgba(20,26,38,.08);font-weight:500}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Admin */
.seg{display:flex;gap:4px;background:var(--soft);border-radius:99px;padding:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:99px;background:none;font-weight:500;cursor:pointer;color:var(--muted);font-size:.92rem}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(20,26,38,.12)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--coral);color:#fff;font-size:.72rem;margin-left:4px}
.req{display:grid;grid-template-columns:72px 1fr;gap:14px;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.req .thumb{width:72px;height:96px;border-radius:10px;background:var(--soft);border:0;cursor:zoom-in;padding:0;overflow:hidden}
.req .thumb img{width:100%;height:100%;object-fit:cover}
.req .info{min-width:0;display:flex;flex-direction:column;gap:6px}
.req .info b{overflow-wrap:anywhere;font-weight:500}
.req .info span{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.crow{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:10px}
.crow .img{aspect-ratio:1;border-radius:12px;max-width:100%}
.crow .t{min-width:0}
.crow .t b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .t span{display:block;font-size:.82rem;color:var(--muted)}
.crow .acts{display:flex;align-items:center;gap:10px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:3px solid var(--pink);outline-offset:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swgroup{display:flex;flex-direction:column;gap:6px}
.swlabel{font-size:.8rem;font-weight:400;color:var(--muted)}
.bandpreview{--b:var(--band-rosa);background:var(--b);color:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.bandpreview b{font-weight:500;text-transform:uppercase;font-size:.95rem}
.bandpreview .pr{display:flex;align-items:center;gap:12px;font-size:.85rem}
.bandpreview .bar{flex:1;height:4px;border-radius:9px;background:color-mix(in srgb,currentColor 30%,transparent);overflow:hidden}
.bandpreview .bar span{display:block;height:100%;background:currentColor}
.custom{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:400}
.custom input[type=radio]{position:absolute;opacity:0}
.custom input[type=color]{width:44px;height:44px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer}
.custom input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.custom input[type=color]::-webkit-color-swatch{border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.custom input[type=radio]:checked ~ input[type=color]::-webkit-color-swatch{box-shadow:0 0 0 2px var(--ink)}
.swatches label{position:relative;cursor:pointer}
.swatches input{position:absolute;opacity:0}
.swatches i{display:block;width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatches input:checked+i{box-shadow:0 0 0 2px var(--ink)}
.swatches input:focus-visible+i{outline:3px solid var(--pink);outline-offset:3px}
.coveredit{display:grid;grid-template-columns:1fr;gap:10px}
.coveredit .img{aspect-ratio:16/9;border-radius:16px;max-width:100%}
.bangrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bangrid .it{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--soft)}
.bangrid .it img{width:100%;height:100%;object-fit:cover}
.bangrid .it button{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(20,26,38,.7);color:#fff;display:grid;place-items:center;cursor:pointer}
.elesson{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.elesson .t{min-width:0}
.elesson .t b{font-weight:500}
.elesson .t span{display:block;font-size:.8rem;color:var(--muted)}

/* Barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 12px;font-size:.92rem;color:var(--muted)}
.tabs .pill{width:84px;height:40px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.tabs a.on{color:var(--coral)}
.tabs a.on .pill{background:var(--coral-soft)}

/* Hoja inferior */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,26,38,.45)}
.sheet-in{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
.sheet-in::before{content:"";width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center;margin-top:-8px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{font-size:1.3rem;font-weight:700}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:640px){.sheet{align-items:center}.sheet-in{border-radius:24px}.sheet-in::before{display:none}}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:500;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="wrap">
    <button class="iconbtn" id="back" type="button" aria-label="Volver">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 id="topTitle"></h2>
  </div>
</header>

<main class="wrap" id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Secciones">
  <div class="wrap">
    <a href="#/home" data-tab="home"><span class="pill">
